---
# Views/layout-only config: no connection or service overrides, so it can be
# used directly (chdig --chdig-config tests/configs/chdig_views_layout.yaml).
views:
  queries:
    filter: "user_1"
  last-queries:
    filter: "user_2"
    start: "4hours"
    end: "30min"
  server_logs:
    limit: 100

layout:
  direction: horizontal
  panes:
  - queries
  - direction: vertical
    ratio: 0.4
    panes:
    - last-queries
    - view: server_logs
      ratio: 0.3
  focus: queries
