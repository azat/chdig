---
# Views/layout-only config: no connection or service overrides, so it can be
# used directly (chdig --chdig-config tests/configs/chdig_views_layout.yaml).
views:
  queries:
    # LIKE pattern (matched against query, user, query_id, ...)
    filter: "SELECT%"

layout:
  direction: horizontal
  panes:
  - view: queries
    ratio: 0.6
  - direction: vertical
    panes:
    - cpu_flamegraph
    - view: server_logs
      ratio: 0.4
  focus: queries
